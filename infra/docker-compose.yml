name: snapcook

services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: always
    # Loopback only by default: the host's reverse proxy reaches the service over the Docker network.
    ports:
      - "${API_BIND:-127.0.0.1:3000}:3000"
    environment:
      DATABASE_URL: postgres://snapcook:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/snapcook
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      APP_SCHEMES: ${APP_SCHEMES:-snapcook://}
      OWNER_EMAILS: ${OWNER_EMAILS:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY}
      MODEL_VISION: ${MODEL_VISION:?set MODEL_VISION}
      MODEL_ADAPT: ${MODEL_ADAPT:?set MODEL_ADAPT}
      MODEL_REVIEW: ${MODEL_REVIEW:?set MODEL_REVIEW}
      MODEL_WRITE: ${MODEL_WRITE:?set MODEL_WRITE}
      MODEL_EMBED: ${MODEL_EMBED:?set MODEL_EMBED}
      IMAGE_DIR: /data/images
    volumes:
      - ${DATA_DIR:-../data}/snaps:/data/snaps
      - ${DATA_DIR:-../data}/images:/data/images
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/api/v1/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg17
    restart: always
    # Loopback only by default, for the command-line tools on the host.
    ports:
      - "${PG_BIND:-127.0.0.1:54329}:5432"
    command: ["postgres", "-c", "shared_buffers=${PG_SHARED_BUFFERS:-256MB}"]
    environment:
      POSTGRES_USER: snapcook
      POSTGRES_DB: snapcook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - ${DATA_DIR:-../data}/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapcook -d snapcook"]
      interval: 5s
      timeout: 3s
      retries: 10

